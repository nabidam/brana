[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dally"
version = "0.1.0"
description = "Track your daily mood from the terminal."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "platformdirs>=4",
]

[project.scripts]
dally = "dally.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "detect-secrets>=1.5",
    "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dally"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP pyupgrade, B bugbear.
select = ["E", "F", "I", "W", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
