name: checks

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Distribution integrity (source + bundle identical, no extra copies)
        run: bash tools/check-dist.sh
      - name: Gate script compiles
        run: python3 -m py_compile tools/brana-gate skills/brana-plan/scripts/brana_gate.py
      - name: Docs pass the gate
        run: python3 tools/brana-gate docs WORKFLOW.md skills/brana-plan/SKILL.md skills/brana-build/SKILL.md skills/brana-ship/SKILL.md examples/notes-v2/specs/001-core/PLAN.md
